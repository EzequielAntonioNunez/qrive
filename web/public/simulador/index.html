<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador UFV</title>
  <link rel="icon" href="/brand/ufv-logo-navy.svg">
  <style>
    html, body { margin: 0; height: 100%; background: #001A33; color: #fff; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
    #unity-canvas { display: block; width: 100vw; height: 100vh; background: #001A33; outline: none; }
    #carga { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #001A33; padding: 24px; text-align: center; transition: opacity .4s ease; }
    #carga.oculta { opacity: 0; pointer-events: none; }
    #carga img { height: 54px; width: auto; }
    #carga h1 { font: 400 26px/1.2 Rockwell, "Rockwell Nova", "Roboto Slab", Georgia, serif; margin: 0; }
    .barra { width: min(360px, 80vw); height: 4px; background: #ffffff26; overflow: hidden; }
    .barra span { display: block; height: 100%; width: 0; background: #649EFF; transition: width .2s ease; }
    #estado { font-size: 13px; color: #C9D6E6; margin: 0; min-height: 1.5em; max-width: 520px; line-height: 1.5; }
    #estado.error { color: #FF5D74; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="carga" role="status" aria-live="polite">
    <img src="/brand/ufv-logo-white.svg" alt="Universidad Francisco de Vitoria">
    <h1>Simulador UFV</h1>
    <div class="barra" aria-hidden="true"><span id="progreso"></span></div>
    <p id="estado">Cargando el simulador…</p>
  </div>
  <script src="Build/7750cefea36aad14e5638a0ded65c143.loader.js"></script>
  <script>
    (function () {
      var canvas = document.getElementById('unity-canvas');
      var carga = document.getElementById('carga');
      var progreso = document.getElementById('progreso');
      var estado = document.getElementById('estado');
      function error(texto) {
        estado.textContent = texto;
        estado.className = 'error';
      }
      if (!window.WebGL2RenderingContext) {
        error('Tu navegador no admite WebGL 2. Abre el enlace con una versión reciente de Chrome, Edge, Firefox o Safari.');
        return;
      }
      canvas.addEventListener('click', function () { canvas.focus(); });
      createUnityInstance(canvas, {
        dataUrl: 'Build/d902393b2fcaec98c7b5d8a4e9e2a741.data.unityweb',
        frameworkUrl: 'Build/aa2c9df9e4d4148042b4f4e50c3a731a.framework.js.unityweb',
        codeUrl: 'Build/320923c47317df6646febaaffbefaec7.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "Universidad Francisco de Vitoria",
        productName: "Simulador UFV",
        productVersion: "1.0",
        // Los avisos (p. ej. descompresión en el navegador) solo van a la consola; los errores se muestran.
        showBanner: function (mensaje, tipo) {
          if (tipo === 'error') error('No se ha podido cargar el simulador. Recarga la página; si persiste, avisa a tu docente.');
          console.warn(mensaje);
        }
      }, function (valor) {
        progreso.style.width = Math.round(valor * 100) + '%';
        estado.textContent = valor < 0.9 ? 'Cargando el simulador… ' + Math.round(valor * 100) + ' %' : 'Preparando la escena…';
      }).then(function () {
        carga.classList.add('oculta');
        canvas.focus();
      }).catch(function (mensaje) {
        console.error(mensaje);
        error('No se ha podido cargar el simulador. Recarga la página; si persiste, avisa a tu docente.');
      });
    })();
  </script>
</body>
</html>
