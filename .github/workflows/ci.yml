name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - run: pnpm install --frozen-lockfile
      # La build de Unity WebGL se versiona: el runner no dispone del editor de Unity.
      - name: Comprobar simulador WebGL
        run: test -s web/public/simulador/index.html
      - run: pnpm check
      # Cadena de suministro: visible en el resumen del job, pero no bloquea (los avisos actuales son de dependencias de desarrollo).
      - name: Auditoría de dependencias (pnpm audit, informativa)
        run: pnpm audit --audit-level high
        continue-on-error: true
      # Puerta de calidad de Simulation Core: API local (identidad demo, D1 local) y 50 simulaciones completas.
      - name: Migraciones D1 locales
        run: pnpm db:local
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Puerta de calidad (SMOKE_RUNS=50)
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm dev:api > dev-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/api/health > /dev/null; then break; fi
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:8787/api/health > /dev/null; then
            echo "::error::La API local no ha arrancado."
            cat dev-api.log
            exit 1
          fi
          SMOKE_RUNS=50 pnpm smoke || { cat dev-api.log | tail -n 80; exit 1; }
      - name: Registro de la API local
        if: failure()
        run: test -f dev-api.log && tail -n 200 dev-api.log || true

  # Cada push a main que pasa la verificación se despliega en axyro.qhel.dev.
  # Se activa con la variable de repositorio CLOUDFLARE_DEPLOY=true (Settings > Secrets and variables > Actions > Variables)
  # una vez creados los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID. Sin ella el job queda omitido, no fallido;
  # mientras tanto se despliega con `pnpm deploy:cloud`.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://axyro.qhel.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Comprobar credenciales de Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN en GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Migraciones D1 remotas
        run: pnpm exec wrangler d1 migrations apply axyro-db --remote
      - name: Despliegue del Worker
        run: pnpm exec wrangler deploy
      - name: Comprobar axyro.qhel.dev
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://axyro.qhel.dev/api/health)
          echo "axyro.qhel.dev responde $code"
          # La API de salud es pública; cualquier otra respuesta indica un despliegue incompleto.
          test "$code" = 200 || { echo "::error::Respuesta inesperada: $code"; exit 1; }
